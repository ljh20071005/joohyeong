<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학점 계산기</title>
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      color: black;
      padding: 2rem;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .subject {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }

    select {
      width: 80px;
      padding: 0.4rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .button {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background-color: black;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: "";
      position: absolute;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 10.01%);
      background-repeat: no-repeat;
      width: 100px;
      height: 100px;
      transform: scale(0);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      animation: none;
    }

    button:active::after {
      left: var(--x);
      top: var(--y);
      opacity: 1;
      transform: scale(1);
      transition: transform 0.3s, opacity 0.8s;
    }

    #result {
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>학점 계산기</h1>
    <form id="gradeForm">
      <div class="subject">수학세미나 (4학점) <select name="수학세미나"></select></div>
      <div class="subject">미분방정식 (3학점) <select name="미분방정식"></select></div>
      <div class="subject">미적분학II (3학점) <select name="미적분학II"></select></div>
      <div class="subject">일반물리학II (3학점) <select name="일반물리학II"></select></div>
      <div class="subject">정보과학프로젝트 (3학점) <select name="정보과학프로젝트"></select></div>
      <div class="subject">머신러닝과 딥러닝 (3학점) <select name="머신러닝과 딥러닝"></select></div>
      <div class="subject">세계사 (2학점) <select name="세계사"></select></div>
      <div class="subject">심화영어 (2학점) <select name="심화영어"></select></div>
      <div class="subject">독서와 개인 (2학점) <select name="독서와 개인"></select></div>
      <div class="button">
        <button type="submit">GO</button>
      </div>
    </form>
    <div id="result"></div>
  </div>

  <script>
    const button = document.querySelector('button');
    button.addEventListener('click', e => {
      const x = e.clientX - e.target.getBoundingClientRect().left;
      const y = e.clientY - e.target.getBoundingClientRect().top;
      button.style.setProperty('--x', x + 'px');
      button.style.setProperty('--y', y + 'px');
    });

    const gradeMap = {
      "A+": 4.3,
      "A0": 4.0,
      "A-": 3.7,
      "B+": 3.3,
      "B0": 3.0,
      "B-": 2.7,
      "C+": 2.3,
      "C0": 2.0,
      "C-": 1.7,
      "D+": 1.3,
      "D0": 1.0,
      "F": 0.0
    };

    const selects = document.querySelectorAll('select');
    selects.forEach(select => {
      for (const grade in gradeMap) {
        const option = document.createElement('option');
        option.value = gradeMap[grade];
        option.text = grade;
        select.appendChild(option);
      }
    });

    document.getElementById('gradeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const form = e.target;
      const grades = {
        '수학세미나': 4,
        '미분방정식': 3,
        '미적분학II': 3,
        '일반물리학II': 3,
        '정보과학프로젝트': 3,
        '머신러닝과 딥러닝': 3,
        '세계사': 2,
        '심화영어': 2,
        '독서와 개인': 2
      };
      let totalCredits = 0;
      let weightedSum = 0;
      for (const subject in grades) {
        const grade = parseFloat(form.elements[subject].value);
        const credit = grades[subject];
        totalCredits += credit;
        weightedSum += grade * credit;
      }
      const gpa = (weightedSum / totalCredits).toFixed(2);
      document.getElementById('result').textContent = `계산된 GPA: ${gpa} / 4.3`;
    });
  </script>
</body>
</html>
