<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학점 계산기</title>
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      color: black;
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .subject {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .grade-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
    }

    .triangle-up, .triangle-down {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      cursor: pointer;
    }

    .triangle-up {
      border-bottom: 15px solid black;
    }

    .triangle-down {
      border-top: 15px solid black;
    }

    .button {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background-color: black;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      top: var(--y);
      left: var(--x);
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, #888, transparent);
      opacity: 0.5;
      transition: width 0.6s ease, height 0.6s ease;
    }

    button:hover::before {
      width: 200px;
      height: 200px;
    }

    #result {
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>학점 계산기</h1>
    <form id="gradeForm"></form>
    <div class="button">
      <button type="submit" form="gradeForm">GO</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const subjects = {
      '수학세미나': 4,
      '미분방정식': 3,
      '미적분학II': 3,
      '일반물리학II': 3,
      '정보과학프로젝트': 3,
      '머신러닝과 딥러닝': 3,
      '세계사': 2,
      '심화영어': 2,
      '독서와 개인': 2
    };

    const gradeOrder = ["D+", "C-", "C0", "C+", "B-", "B0", "B+", "A-", "A0", "A+"];
    const gradeMap = {
      "A+": 4.3, "A0": 4.0, "A-": 3.7,
      "B+": 3.3, "B0": 3.0, "B-": 2.7,
      "C+": 2.3, "C0": 2.0, "C-": 1.7,
      "D+": 1.3
    };

    const form = document.getElementById('gradeForm');

    for (const subject in subjects) {
      const wrapper = document.createElement('div');
      wrapper.className = 'subject';

      const name = document.createElement('div');
      name.textContent = `${subject}  (${subjects[subject]})`;

      const gradeControl = document.createElement('div');
      gradeControl.className = 'grade-control';

      const up = document.createElement('div');
      up.className = 'triangle-up';

      const circle = document.createElement('div');
      circle.className = 'circle';
      circle.textContent = 'A+';
      circle.dataset.index = gradeOrder.length - 1;
      circle.dataset.subject = subject;

      const down = document.createElement('div');
      down.className = 'triangle-down';

      up.addEventListener('click', () => {
        let index = parseInt(circle.dataset.index);
        if (index < gradeOrder.length - 1) index++;
        circle.dataset.index = index;
        circle.textContent = gradeOrder[index];
      });

      down.addEventListener('click', () => {
        let index = parseInt(circle.dataset.index);
        if (index > 0) index--;
        circle.dataset.index = index;
        circle.textContent = gradeOrder[index];
      });

      gradeControl.appendChild(up);
      gradeControl.appendChild(circle);
      gradeControl.appendChild(down);
      wrapper.appendChild(name);
      wrapper.appendChild(gradeControl);
      form.appendChild(wrapper);
    }

    const button = document.querySelector('button');
    button.addEventListener('mousemove', e => {
      const x = e.clientX - e.target.getBoundingClientRect().left;
      const y = e.clientY - e.target.getBoundingClientRect().top;
      button.style.setProperty('--x', `${x}px`);
      button.style.setProperty('--y', `${y}px`);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let totalCredits = 0;
      let weightedSum = 0;
      const circles = document.querySelectorAll('.circle');
      circles.forEach(circle => {
        const grade = circle.textContent;
        const subject = circle.dataset.subject;
        const credit = subjects[subject];
        totalCredits += credit;
        weightedSum += gradeMap[grade] * credit;
      });
      const gpa = (weightedSum / totalCredits).toFixed(2);
      document.getElementById('result').textContent = ` ${gpa} / 4.3`;
    });
  </script>
</body>
</html>
