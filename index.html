<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GSA</title>

<!-- SheetJS: XLSM 파서 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
  :root { --bg:#0b1220; --panel:#101827; --muted:#94a3b8; --text:#e5e7eb; --accent:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  h1 { margin:0 0 12px; font-size:26px; }
  p.hint { margin:0 0 18px; color:var(--muted); }
  .panel { background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
           border:1px solid rgba(148,163,184,0.18); border-radius:18px; padding:18px; }
  .row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  input[type="text"] { flex:1; min-width:220px; padding:12px 14px; border-radius:12px;
                       border:1px solid rgba(148,163,184,0.25); background:#0f172a; color:var(--text); outline:none; }
  input[type="text"]::placeholder { color:#5b708e; }
  button { padding:12px 16px; border-radius:12px; border:1px solid rgba(148,163,184,0.25);
           background:#13223a; color:var(--text); cursor:pointer; transition:transform .06s ease; }
  button:hover { transform: translateY(-1px); }
  .warn { background:#2a1120; border:1px solid #7f1d1d; padding:12px; border-radius:12px; color:#fecaca; margin-bottom:12px; display:none; }
  .meta { margin-bottom:8px; color:var(--muted); }
  .count { font-weight:600; color:var(--accent); }
  .empty { padding:14px; color:var(--muted); }
  .list { max-height:60vh; overflow:auto; }
  table { width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border-radius:14px; }
  thead th { text-align:left; padding:12px; background:#0f1a2c; border-bottom:1px solid rgba(148,163,184,0.2); position:sticky; top:0; }
  tbody td { padding:12px; border-bottom:1px solid rgba(148,163,184,0.15); vertical-align:top; }
  tr:hover td { background:rgba(96,165,250,0.06); }
  .chip { display:inline-block; margin:4px 8px 4px 0; padding:6px 10px; border-radius:999px;
          background:rgba(96,165,250,0.12); border:1px solid rgba(96,165,250,0.25); }
</style>
</head>
<body>
  <h1>같은 수업 친구 찾기 (40기, 41기) </h1>
  <p class="hint"> 학생 이름을 검색하세요. </p>

  <div id="warn" class="warn"></div>

  <div class="panel">
    <div class="row">
      <input id="nameInput" type="text" placeholder="예: 이주형" onkeydown="if(event.key==='Enter') search()" />
      <button onclick="search()">검색</button>
      <button onclick="clearAll()">초기화</button>
    </div>
    <div id="meta" class="meta"></div>
    <div class="list">
      <table id="resultTable" style="display:none;">
        <thead>
          <tr>
            <th style="width:42%;">과목(반)</th>
            <th>같은 수업 친구들 <span class="muted">(이름만)</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty">엑셀을 불러오는 중이거나, 학생 이름을 입력하고 검색을 눌러주세요.</div>
    </div>
  </div>

<script>
const XLSM_PATH = './timeta.xlsm';
const SHEET_NAME = '학생';
const studentHeaderRe = /^\s*(\d{5})\s+(.+?)\s*$/;
const removeTimeRe   = /\(\s*\d+\s*시간\s*\)$/;

const courseToStudents = new Map(); // course -> Set(names)
const studentToCourses = new Map(); // name -> Set(courses)
let loaded = false;

async function loadXLSM(){
  const warn = document.getElementById('warn');
  try {
    const res = await fetch(XLSM_PATH, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' - ' + res.statusText);
    const buf = await res.arrayBuffer();

    const wb = XLSX.read(buf, { type: 'array' });
    if (!wb.Sheets[SHEET_NAME]) throw new Error('시트 "' + SHEET_NAME + '" 를 찾을 수 없습니다.');
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[SHEET_NAME], { header: 1, raw: false });

    buildMaps(rows);
    buildNameDatalist();
    applyFixes();  
    loaded = true;
    document.getElementById('empty').textContent = '학생 이름을 입력하고 검색을 눌러주세요.';
  } catch (e) {
    warn.style.display = 'block';
    warn.innerHTML = '⚠️ timeta.xlsm 로드 실패: ' + e.message +
                     '<br>· 파일이 index.html과 같은 폴더에 있는지 확인하세요.' +
                     '<br>· 시트 이름이 "' + SHEET_NAME + '" 가 맞는지 확인하세요.';
    console.error(e);
  }
}

function buildMaps(rows){
  let currentStudent = null;
  for (const row of rows){
    const a = (row?.[0] ?? '').trim();
    const m = a.match(studentHeaderRe);
    if (m){
      currentStudent = m[2].trim();
      if (!studentToCourses.has(currentStudent)) studentToCourses.set(currentStudent, new Set());
      continue;
    }
    if (!currentStudent) continue;

    for (let ci = 0; ci <= 4 && ci < row.length; ci++){
      let text = (row?.[ci] ?? '').trim();
      if (!text) continue;
      if (text.includes('학점')) continue;

      let norm = text.replace(removeTimeRe, '').trim();
      if (!norm.includes('반')) continue;
      norm = norm.replace(/\s+/g, ' ');

      if (!courseToStudents.has(norm)) courseToStudents.set(norm, new Set());
      courseToStudents.get(norm).add(currentStudent);
      studentToCourses.get(currentStudent).add(norm);
    }
  }
}

function buildNameDatalist(){
  const names = Array.from(studentToCourses.keys()).sort((a,b)=>a.localeCompare(b));
  const input = document.getElementById('nameInput');
  input.setAttribute('list','names');
  let dl = document.getElementById('names');
  if (!dl){ dl = document.createElement('datalist'); dl.id = 'names'; document.body.appendChild(dl); }
  dl.innerHTML = '';
  names.forEach(n => { const o=document.createElement('option'); o.value=n; dl.appendChild(o); });
}

function normalizeName(name){ return (name||'').trim(); }

function search(){
  if (!loaded) return;
  const input = document.getElementById('nameInput');
  const name = normalizeName(input.value);
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('resultTable');
  const empty = document.getElementById('empty');
  const meta  = document.getElementById('meta');

  tbody.innerHTML = '';
  table.style.display = 'none';
  empty.style.display = 'block';
  meta.textContent = '';

  if (!name) return;

  const coursesSet = studentToCourses.get(name);
  if (!coursesSet || coursesSet.size === 0){
    empty.textContent = `'` + name + `' 학생을 찾지 못했거나 수강 정보가 없습니다.`;
    return;
  }

  const courses = Array.from(coursesSet).sort((a,b)=>a.localeCompare(b));
  const allPeers = new Set();

  courses.forEach(course => {
    const peers = Array.from(courseToStudents.get(course) || [])
      .filter(n => n !== name)
      .sort((a,b)=>a.localeCompare(b));
    peers.forEach(p => allPeers.add(p));

    const tr = document.createElement('tr');

    const tdCourse = document.createElement('td');
    tdCourse.textContent = course;

    const tdPeers = document.createElement('td');
    if (peers.length === 0){
      tdPeers.innerHTML = '<span class="muted">같이 듣는 친구 없음</span>';
    } else {
      peers.forEach(p => {
        const span = document.createElement('span');
        span.className = 'chip';
        span.textContent = p;
        tdPeers.appendChild(span);
      });
    }

    tr.appendChild(tdCourse);
    tr.appendChild(tdPeers);
    tbody.appendChild(tr);
  });

  meta.innerHTML = `'` + name + `' 학생의 과목 수: <span class="count">` + courses.length +
                   `</span>`;

  empty.style.display = 'none';
  table.style.display = 'table';
}





/* ====== 수동 교정(Overrides) ====== */
// 필요할 때마다 여기에 추가/수정하면 됨
// 예: 강제로 추가해야 하는 경우가 있으면 여기에
const FIXES_ADD = {
  // "학생이름": ["과목명 1반", "과목명 2반"]
};

const FIXES_REMOVE = {
  "김주혁": [
    "기업가정신 및 기술창업교육 1반",
    "자연재해와 인간의 삶 2반"
  ],
  "강윤": [
    "자연재해와 인간의 삶 2반"
  ]
};

function applyFixes() {
  // 제거
  for (const [stu, courses] of Object.entries(FIXES_REMOVE)) {
    const set = studentToCourses.get(stu);
    if (!set) continue;
    courses.forEach(course => {
      if (set.has(course)) set.delete(course);
      const cset = courseToStudents.get(course);
      if (cset) cset.delete(stu);
    });
    // 과목이 비어있으면 entry 정리(선택)
    if (set.size === 0) studentToCourses.delete(stu);
  }

  // 추가
  for (const [stu, courses] of Object.entries(FIXES_ADD)) {
    if (!studentToCourses.has(stu)) studentToCourses.set(stu, new Set());
    const sset = studentToCourses.get(stu);
    courses.forEach(course => {
      sset.add(course);
      if (!courseToStudents.has(course)) courseToStudents.set(course, new Set());
      courseToStudents.get(course).add(stu);
    });
  }
}
  
function clearAll(){
  document.getElementById('nameInput').value = '';
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('resultTable').style.display = 'none';
  document.getElementById('empty').style.display = 'block';
  document.getElementById('meta').textContent = '';
  document.getElementById('nameInput').focus();
}

window.addEventListener('DOMContentLoaded', loadXLSM);
</script>
</body>
</html>
